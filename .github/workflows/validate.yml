name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.10 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked validation dependencies
        run: python -m pip install --require-hashes -r requirements-validation.lock
      - name: Run validation gates
        run: python scripts/validate.py
      - name: Build validated deployment artifact
        run: python scripts/build_deployment.py
      - uses: actions/upload-artifact@v4
        with:
          name: validated-app
          path: dist/release.zip
          if-no-files-found: error
          retention-days: 7
